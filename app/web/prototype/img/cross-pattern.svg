<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="132" height="132" viewBox="0 0 132 132">
  <!-- Carved Coptic crosses (original design): incised body, light lip above, shadow below. -->
  <defs>
    <g id="c">
      <g id="arm">
        <rect x="-3.4" y="-17" width="6.8" height="11.5" rx="1"/>
        <circle cx="0" cy="-19.2" r="3.4"/>
        <circle cx="-4.6" cy="-15.6" r="2.6"/>
        <circle cx="4.6" cy="-15.6" r="2.6"/>
      </g>
      <use xlink:href="#arm" transform="rotate(90)"/>
      <use xlink:href="#arm" transform="rotate(180)"/>
      <use xlink:href="#arm" transform="rotate(270)"/>
      <circle r="6.2"/>
    </g>
    <g id="s">
      <rect x="-1.6" y="-7" width="3.2" height="14" rx=".8"/>
      <rect x="-7" y="-1.6" width="14" height="3.2" rx=".8"/>
      <circle r="2.6"/>
    </g>
  </defs>
  <g fill="#ffcf9a" fill-opacity=".07" transform="translate(0 -1)">
    <use xlink:href="#c" x="66" y="66"/><use xlink:href="#s" x="0" y="0"/><use xlink:href="#s" x="132" y="0"/><use xlink:href="#s" x="0" y="132"/><use xlink:href="#s" x="132" y="132"/>
  </g>
  <g fill="#000" fill-opacity=".30" transform="translate(0 1)">
    <use xlink:href="#c" x="66" y="66"/><use xlink:href="#s" x="0" y="0"/><use xlink:href="#s" x="132" y="0"/><use xlink:href="#s" x="0" y="132"/><use xlink:href="#s" x="132" y="132"/>
  </g>
  <g fill="#160702" fill-opacity=".22">
    <use xlink:href="#c" x="66" y="66"/><use xlink:href="#s" x="0" y="0"/><use xlink:href="#s" x="132" y="0"/><use xlink:href="#s" x="0" y="132"/><use xlink:href="#s" x="132" y="132"/>
  </g>
</svg>
